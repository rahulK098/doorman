[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "doorman"
version = "0.1.0.dev0"
description = "Layered prompt-injection defense for tool-calling AI agents: intent alignment, provenance tracking, canary tokens, and a self-updating red-team benchmark."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Doorman contributors" }]
keywords = ["prompt-injection", "llm", "security", "guardrails", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
# Core has no runtime dependencies. See docs/adr/0006-packaging-and-toolchain.md
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
langchain = ["langchain-core>=0.3"]
bench = ["typer>=0.12", "rich>=13"]
all = ["doorman[anthropic,langchain,bench]"]

[project.scripts]
doorman-bench = "doorman.bench.cli:main"

[project.urls]
Homepage = "https://github.com/rk406424/doorman"
Documentation = "https://github.com/rk406424/doorman/tree/main/docs"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/doorman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
include = ["src/**/*.py", "tests/**/*.py", "examples/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/doorman"]
